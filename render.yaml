services:
  - type: web
    name: ai-document-scanning
    env: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: gunicorn app:app
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: ai-document-scanning-db
    plan: free
    region: singapore
